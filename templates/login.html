{% extends "base.html" %}
{% block content %}
<div class="container">
    <div class="quote-box">
        <h2 style="text-align:center; color: var(--primary-navy);">Admin Portal Login</h2>
        <form method="POST">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" required>
            </div>
            <button type="submit" class="btn-primary" style="width:100%; border:none;">Login</button>
        </form>
    </div>
</div>
{% endblock %}
